name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: suleman-uzair/asciiunits-testsuite
          # Match the compiled grammar artifact; reject mismatched corpus seals.
          ref: 3134bd30753b709bd638c123963fec48a9416deb
          path: asciiunits-testsuite
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run replay
        env:
          CORPUS_DIR: ${{ github.workspace }}/asciiunits-testsuite/corpora/unitsml
      - run: npm run smoke:package
        env:
          CORPUS_DIR: ${{ github.workspace }}/asciiunits-testsuite/corpora/unitsml
